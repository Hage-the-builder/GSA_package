[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gym-structural-analyzer"
version = "1.0.0"
authors = [
    { name="Abe", email="abdelrahmanabdelrazeq0@gmail.com" }
]
description = "An open-source structural mechanics tool using discrete numerical integration to analyze column buckling and material crushing thresholds."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = ["src"]
